<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Japanese Teacher — UI Prototype (Issue #4)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            japanese: ['"Noto Sans JP"', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              900: '#881337'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Furigana Styling */
    ruby {
      ruby-align: center;
      ruby-position: over;
      margin: 0 1px;
    }
    rt {
      font-size: 0.58em;
      line-height: 1;
      color: #cbd5e1;
      font-weight: 500;
      user-select: none;
      transition: all 0.2s ease;
    }
    .furigana-target rt {
      color: #fb7185;
      font-weight: 700;
    }
    .furigana-hidden rt {
      opacity: 0;
      transform: translateY(2px);
    }
    .furigana-target-only rt:not(.is-target) {
      opacity: 0;
    }
    ruby:hover rt {
      opacity: 1 !important;
      transform: translateY(0);
    }
    /* Active karaoke highlight pulse */
    @keyframes sentencePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); }
    }
    .active-sentence {
      animation: sentencePulse 1.8s infinite;
    }
    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center pb-24 antialiased selection:bg-rose-500 selection:text-white">

  <!-- Main Mobile Container Simulator -->
  <div class="w-full max-w-md min-h-screen bg-slate-900 border-x border-slate-800 shadow-2xl flex flex-col relative pb-32">
    
    <!-- Top Status / Header -->
    <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center font-bold text-white shadow-lg shadow-rose-500/20 font-japanese text-sm">
          日
        </div>
        <div>
          <h1 class="font-display font-bold text-sm tracking-tight leading-tight">AI Japanese Teacher</h1>
          <p class="text-[10px] text-slate-400 font-medium">JLPT N5 Daily Lesson</p>
        </div>
      </div>
      <div class="flex items-center space-x-1.5">
        <span class="px-2 py-0.5 text-[11px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-full">
          JLPT N5
        </span>
        <button id="voiceSelectorBtn" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition" title="Audio Voice Settings">
          🔊
        </button>
      </div>
    </header>

    <!-- Global Study Settings Bar -->
    <div class="px-4 py-2 bg-slate-900/70 border-b border-slate-800/60 flex items-center justify-between text-xs text-slate-300">
      <div class="flex items-center space-x-1">
        <span class="text-slate-400 text-[11px]">Furigana:</span>
        <select id="furiganaModeSelect" class="bg-slate-800 border border-slate-700 rounded-md px-2 py-0.5 text-[11px] font-medium text-slate-200 focus:outline-none focus:border-rose-500">
          <option value="all">Always On</option>
          <option value="target">Target Words Only</option>
          <option value="hover">Tap / Hover Only</option>
        </select>
      </div>
      <div class="flex items-center space-x-1">
        <span class="text-slate-400 text-[11px]">English:</span>
        <button id="toggleTranslationsBtn" class="px-2 py-0.5 bg-slate-800 border border-slate-700 rounded-md text-[11px] font-medium hover:bg-slate-700 transition">
          Visible
        </button>
      </div>
    </div>

    <!-- Voice Picker Modal -->
    <div id="voiceModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm text-slate-100 flex items-center gap-2">
            <span>🗣️</span> Japanese TTS Voice Engine
          </h3>
          <button id="closeVoiceModalBtn" class="text-slate-400 hover:text-slate-200 text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-400 mb-3">Detected device voices for <code class="text-rose-400">ja-JP</code>:</p>
        <select id="voiceListSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-xs mb-4 focus:ring-2 focus:ring-rose-500">
          <option value="">Default System Japanese Voice</option>
        </select>
        <button id="saveVoiceBtn" class="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold rounded-xl transition">
          Done
        </button>
      </div>
    </div>

    <!-- Dynamic Variant Container -->
    <div id="variantRoot" class="flex-1 p-4 space-y-4">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Persistent Bottom Audio Player Controls -->
    <div id="audioPlayerBar" class="sticky bottom-0 z-20 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 px-4 py-3 shadow-2xl">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <button id="playAllBtn" class="w-10 h-10 rounded-full bg-rose-500 hover:bg-rose-400 active:scale-95 text-white flex items-center justify-center shadow-lg shadow-rose-500/25 transition">
            <span id="playIcon" class="ml-0.5 text-sm">▶</span>
          </button>
          <div>
            <div class="text-xs font-bold text-slate-200" id="playerStatusLabel">Tap Play to Listen</div>
            <div class="text-[10px] text-slate-400" id="playerProgressLabel">Sentence 0 / 5</div>
          </div>
        </div>
        
        <!-- Speed & Loop Toggles -->
        <div class="flex items-center space-x-1.5">
          <button id="loopSentenceBtn" class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition" title="Toggle Repeating Sentence">
            🔁 Loop: Off
          </button>
          <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-[11px] font-medium">
            <button class="speed-btn px-2 py-0.5 rounded text-slate-400 hover:text-slate-200" data-speed="0.75">0.75x</button>
            <button class="speed-btn px-2 py-0.5 rounded bg-rose-600 text-white font-bold" data-speed="1.0">1.0x</button>
            <button class="speed-btn px-2 py-0.5 rounded text-slate-400 hover:text-slate-200" data-speed="1.25">1.25x</button>
          </div>
        </div>
      </div>

      <!-- Playback Progress Track -->
      <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-rose-500 to-pink-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

  </div>

  <!-- FLOATING PROTOTYPE SWITCHER -->
  <div class="fixed bottom-3 z-50 bg-slate-900/90 backdrop-blur-md border border-rose-500/40 text-slate-100 shadow-2xl rounded-full px-4 py-2 flex items-center space-x-3 text-xs">
    <button id="prevVariantBtn" class="p-1 hover:text-rose-400 font-bold transition">◀</button>
    <div class="flex items-center space-x-1 font-semibold">
      <span class="text-rose-400 font-bold uppercase tracking-wider text-[10px]">Variant:</span>
      <span id="currentVariantLabel" class="text-slate-200">C (Dialogue Studio + Primer)</span>
    </div>
    <button id="nextVariantBtn" class="p-1 hover:text-rose-400 font-bold transition">▶</button>
    <div class="h-3 w-px bg-slate-700"></div>
    <div class="flex space-x-1">
      <button class="var-select-btn px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700" data-var="A">A</button>
      <button class="var-select-btn px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700" data-var="B">B</button>
      <button class="var-select-btn px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-600 text-white" data-var="C">C</button>
    </div>
  </div>

  <!-- JavaScript Controller -->
  <script>
    // 1. LESSON DATA
    const LESSON_DATA = {
      topic: "カフェでの注文",
      topicEnglish: "Ordering at a Café",
      level: "JLPT N5",
      targetVocabulary: [
        { 
          word: "注文", 
          reading: "ちゅうもん", 
          romaji: "chūmon", 
          meaning: "an order / to order", 
          partOfSpeech: "Noun / Suru-verb",
          exampleJa: "コーヒーを注文します。",
          exampleEn: "I will order coffee."
        },
        { 
          word: "店員", 
          reading: "てんいん", 
          romaji: "ten'in", 
          meaning: "store clerk / barista", 
          partOfSpeech: "Noun",
          exampleJa: "店員さんに聞きました。",
          exampleEn: "I asked the store clerk."
        },
        { 
          word: "持ち帰り", 
          reading: "もちかえり", 
          romaji: "mochikaeri", 
          meaning: "takeout / to-go", 
          partOfSpeech: "Noun",
          exampleJa: "持ち帰りできますか？",
          exampleEn: "Can I get this for takeout?"
        },
        { 
          word: "温かい", 
          reading: "あたたかい", 
          romaji: "atatakai", 
          meaning: "warm / hot (food or drink)", 
          partOfSpeech: "I-adjective",
          exampleJa: "温かいお茶を飲みます。",
          exampleEn: "I drink warm tea."
        },
        { 
          word: "会計", 
          reading: "かいけい", 
          romaji: "kaikei", 
          meaning: "bill / check / payment", 
          partOfSpeech: "Noun",
          exampleJa: "お会計をお願いします。",
          exampleEn: "The check, please."
        }
      ],
      sentences: [
        {
          id: 1,
          speaker: "Customer (You)",
          speakerRole: "customer",
          japanese: "店員さんに温かいコーヒーを注文しました。",
          english: "I ordered a hot coffee from the store clerk.",
          tokens: [
            { surface: "店員", reading: "てんいん", isTarget: true },
            { surface: "さん", reading: "", isTarget: false },
            { surface: "に", reading: "", isTarget: false },
            { surface: "温かい", reading: "あたたかい", isTarget: true },
            { surface: "コーヒー", reading: "", isTarget: false },
            { surface: "を", reading: "", isTarget: false },
            { surface: "注文", reading: "ちゅうもん", isTarget: true },
            { surface: "しました", reading: "", isTarget: false },
            { surface: "。", reading: "", isTarget: false }
          ]
        },
        {
          id: 2,
          speaker: "Barista (Staff)",
          speakerRole: "clerk",
          japanese: "「店内でお召し上がりですか、お持ち帰りですか？」",
          english: "'Will you be having this in-store, or for takeout?'",
          tokens: [
            { surface: "「", reading: "", isTarget: false },
            { surface: "店内", reading: "てんない", isTarget: false },
            { surface: "で", reading: "", isTarget: false },
            { surface: "お", reading: "", isTarget: false },
            { surface: "召し上がり", reading: "めしあがり", isTarget: false },
            { surface: "ですか", reading: "", isTarget: false },
            { surface: "、", reading: "", isTarget: false },
            { surface: "お", reading: "", isTarget: false },
            { surface: "持ち帰り", reading: "もちかえり", isTarget: true },
            { surface: "ですか", reading: "", isTarget: false },
            { surface: "？」", reading: "", isTarget: false }
          ]
        },
        {
          id: 3,
          speaker: "Customer (You)",
          speakerRole: "customer",
          japanese: "「持ち帰りでお願いします。」",
          english: "'Takeout, please.'",
          tokens: [
            { surface: "「", reading: "", isTarget: false },
            { surface: "持ち帰り", reading: "もちかえり", isTarget: true },
            { surface: "で", reading: "", isTarget: false },
            { surface: "お", reading: "", isTarget: false },
            { surface: "願い", reading: "ねがい", isTarget: false },
            { surface: "します", reading: "", isTarget: false },
            { surface: "。」", reading: "", isTarget: false }
          ]
        },
        {
          id: 4,
          speaker: "Barista (Staff)",
          speakerRole: "clerk",
          japanese: "「お会計は五百円になります。」",
          english: "'That will be 500 yen, please.'",
          tokens: [
            { surface: "「", reading: "", isTarget: false },
            { surface: "お", reading: "", isTarget: false },
            { surface: "会計", reading: "かいけい", isTarget: true },
            { surface: "は", reading: "", isTarget: false },
            { surface: "五百円", reading: "ごひゃくえん", isTarget: false },
            { surface: "に", reading: "", isTarget: false },
            { surface: "なります", reading: "", isTarget: false },
            { surface: "。」", reading: "", isTarget: false }
          ]
        },
        {
          id: 5,
          speaker: "Customer (You)",
          speakerRole: "customer",
          japanese: "コーヒーを受け取って、駅へ向かいました。",
          english: "I received the coffee and headed toward the station.",
          tokens: [
            { surface: "コーヒー", reading: "", isTarget: false },
            { surface: "を", reading: "", isTarget: false },
            { surface: "受け取って", reading: "うけとって", isTarget: false },
            { surface: "、", reading: "", isTarget: false },
            { surface: "駅", reading: "えき", isTarget: false },
            { surface: "へ", reading: "", isTarget: false },
            { surface: "向かいました", reading: "むかいました", isTarget: false },
            { surface: "。", reading: "", isTarget: false }
          ]
        }
      ]
    };

    // 2. STATE
    const state = {
      variant: 'C', // Default to user's favorite C
      furiganaMode: 'all',
      showEnglish: true,
      playbackRate: 1.0,
      loopSentence: false,
      activeSentenceIndex: -1,
      isPlaying: false,
      selectedVoice: null,
      expandedVocabIndex: 0 // First vocab card open by default
    };

    // 3. AUDIO SYNTHESIS
    let synth = window.speechSynthesis;
    let jaVoices = [];

    function populateVoices() {
      if (!synth) return;
      const allVoices = synth.getVoices();
      jaVoices = allVoices.filter(v => v.lang && (v.lang.startsWith('ja') || v.lang.includes('JP')));
      const select = document.getElementById('voiceListSelect');
      select.innerHTML = '<option value="">Default System Japanese Voice</option>';
      jaVoices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        select.appendChild(opt);
      });
      if (jaVoices.length > 0 && !state.selectedVoice) {
        state.selectedVoice = jaVoices[0];
      }
    }

    if (synth) {
      populateVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
      }
    }

    function speakText(text, rate = state.playbackRate, onDone) {
      if (!synth) return;
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = rate;
      if (state.selectedVoice) utter.voice = state.selectedVoice;
      if (onDone) utter.onend = onDone;
      synth.speak(utter);
    }

    function speakSentence(index, onComplete) {
      if (!synth) return;
      synth.cancel();
      if (index < 0 || index >= LESSON_DATA.sentences.length) {
        stopPlayback();
        return;
      }

      state.activeSentenceIndex = index;
      state.isPlaying = true;
      updateUIState();

      const item = LESSON_DATA.sentences[index];
      const utter = new SpeechSynthesisUtterance(item.japanese);
      utter.lang = 'ja-JP';
      utter.rate = state.playbackRate;
      if (state.selectedVoice) utter.voice = state.selectedVoice;

      utter.onend = () => {
        if (!state.isPlaying) return;
        if (state.loopSentence) {
          speakSentence(index, onComplete);
        } else if (onComplete) {
          onComplete();
        } else {
          stopPlayback();
        }
      };

      utter.onerror = () => stopPlayback();
      synth.speak(utter);
    }

    function playFullPassage(fromIndex = 0) {
      let cur = fromIndex;
      function next() {
        if (!state.isPlaying) return;
        cur++;
        if (cur < LESSON_DATA.sentences.length) {
          speakSentence(cur, next);
        } else {
          stopPlayback();
        }
      }
      speakSentence(cur, next);
    }

    function stopPlayback() {
      if (synth) synth.cancel();
      state.isPlaying = false;
      state.activeSentenceIndex = -1;
      updateUIState();
    }

    function togglePlayAll() {
      if (state.isPlaying) {
        stopPlayback();
      } else {
        playFullPassage(0);
      }
    }

    // 4. RUBY TOKEN RENDERING
    function renderTokens(tokens) {
      return tokens.map(t => {
        const isTarget = t.isTarget;
        const targetClass = isTarget ? 'text-rose-400 font-bold bg-rose-500/10 px-1 py-0.5 rounded' : '';
        const rtTargetClass = isTarget ? 'is-target font-bold text-rose-300' : '';
        
        if (!t.reading) {
          return `<span class="${targetClass}">${t.surface}</span>`;
        }
        return `<ruby class="${targetClass}">${t.surface}<rt class="${rtTargetClass}">${t.reading}</rt></ruby>`;
      }).join('');
    }

    // 5. VOCABULARY PRIMER SECTION (Shared / Enhanced Component)
    function renderVocabularyPrimer() {
      const items = LESSON_DATA.targetVocabulary.map((v, idx) => {
        const isExpanded = state.expandedVocabIndex === idx;
        return `
          <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5 transition-all shadow-sm">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2.5">
                <span class="w-5 h-5 rounded-full bg-rose-500/20 text-rose-400 text-[11px] font-bold flex items-center justify-center">
                  ${idx + 1}
                </span>
                <div>
                  <div class="flex items-baseline space-x-2">
                    <ruby class="text-lg font-bold font-japanese text-rose-400">${v.word}<rt class="text-rose-300 text-[10px] font-semibold">${v.reading}</rt></ruby>
                    <span class="text-xs text-slate-400 font-mono tracking-wider">/ ${v.romaji} /</span>
                  </div>
                  <div class="text-xs text-slate-200 font-medium">${v.meaning}</div>
                </div>
              </div>
              <div class="flex items-center space-x-1.5">
                <button class="vocab-speak-btn p-2 rounded-xl bg-slate-700 hover:bg-rose-600 text-slate-200 hover:text-white transition active:scale-95" data-word="${v.word}" title="Listen to word">
                  🔊
                </button>
              </div>
            </div>

            <!-- Example sentence showing real context usage -->
            <div class="mt-2.5 pt-2 border-t border-slate-700/60 flex items-center justify-between text-xs">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Example:</span>
                <p class="text-slate-200 font-japanese text-xs font-medium">${v.exampleJa}</p>
                <p class="text-slate-400 text-[11px]">${v.exampleEn}</p>
              </div>
              <button class="vocab-example-speak-btn px-2 py-1 rounded-lg bg-slate-750 hover:bg-slate-700 text-slate-300 text-[10px] font-medium border border-slate-700/70 transition" data-phrase="${v.exampleJa}">
                ▶ Ex
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <!-- Daily Vocabulary Primer Block -->
        <div class="bg-gradient-to-br from-slate-800/90 to-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl">
          <div class="flex items-center justify-between mb-2.5">
            <div class="flex items-center space-x-2">
              <span class="text-base">📚</span>
              <h2 class="font-display font-bold text-sm text-slate-100">Step 1: Daily Target Words</h2>
            </div>
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20">
              5 Words
            </span>
          </div>
          <p class="text-xs text-slate-400 mb-3">Review and listen to these cohesive words before practicing the conversation:</p>
          <div class="space-y-2">
            ${items}
          </div>
        </div>
      `;
    }

    // ── Variant C: Dialogue Studio with Distinct Bubble Tints & Vocab Primer ──
    function renderVariantC() {
      const messages = LESSON_DATA.sentences.map((s, idx) => {
        const isCustomer = s.speakerRole === "customer";
        const isActive = state.activeSentenceIndex === idx;
        
        // Highly distinct color tints:
        // Customer (You): Sakura / Rose tint
        // Clerk (Staff): Emerald / Teal / Mint tint
        const bubbleStyle = isCustomer
          ? (isActive 
              ? 'bg-gradient-to-br from-rose-600 to-pink-600 text-white border-rose-400 ring-2 ring-rose-400/80 active-sentence shadow-rose-900/40'
              : 'bg-gradient-to-br from-rose-950/70 to-slate-900 border border-rose-500/30 text-rose-50 shadow-md')
          : (isActive 
              ? 'bg-gradient-to-br from-emerald-600 to-teal-600 text-white border-emerald-400 ring-2 ring-emerald-400/80 active-sentence shadow-emerald-900/40'
              : 'bg-gradient-to-br from-emerald-950/70 to-slate-900 border border-emerald-500/30 text-emerald-50 shadow-md');

        const badgeStyle = isCustomer
          ? 'bg-rose-500/20 text-rose-300 border-rose-500/30'
          : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';

        const speakerIcon = isCustomer ? '👤 客 (You)' : '☕ 店 (Staff)';

        return `
          <div class="flex items-start gap-2.5 ${isCustomer ? 'flex-row-reverse' : 'flex-row'} mb-3.5 cursor-pointer sentence-row" data-index="${idx}">
            
            <!-- Avatar -->
            <div class="w-8 h-8 rounded-2xl flex items-center justify-center text-xs font-bold shrink-0 shadow-md border ${badgeStyle}">
              ${isCustomer ? '客' : '店'}
            </div>

            <!-- Speech Bubble with distinct tint -->
            <div class="max-w-[84%] rounded-3xl p-3.5 shadow-lg border transition-all ${bubbleStyle}">
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="text-[10px] font-bold tracking-wide uppercase opacity-80 flex items-center gap-1">
                  ${speakerIcon}
                </span>
                <span class="text-[10px] font-semibold opacity-70">
                  ${isActive && state.isPlaying ? '🔊 Speaking...' : 'Tap to hear ▶'}
                </span>
              </div>

              <!-- Japanese Text with Furigana -->
              <div class="text-base sm:text-lg font-japanese leading-loose tracking-wide">
                ${renderTokens(s.tokens)}
              </div>

              <!-- English Translation -->
              ${state.showEnglish ? `
                <p class="mt-2 text-xs opacity-85 border-t border-white/10 pt-1.5 leading-relaxed">
                  ${s.english}
                </p>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <!-- Step 1: Vocabulary Primer -->
          ${renderVocabularyPrimer()}

          <!-- Step 2: Dialogue Flow Header -->
          <div class="bg-gradient-to-br from-slate-800/70 to-slate-900/70 border border-slate-800 rounded-3xl p-4 shadow-xl">
            <div class="flex items-center justify-between mb-1">
              <div class="flex items-center space-x-2">
                <span class="text-base">💬</span>
                <h2 class="font-display font-bold text-sm text-slate-100">Step 2: Conversation Roleplay</h2>
              </div>
              <span class="text-xs text-rose-400 font-semibold">${LESSON_DATA.topic}</span>
            </div>
            <p class="text-xs text-slate-400">Tap any speech bubble below to hear that character speak:</p>
          </div>

          <!-- Speech Bubbles -->
          <div class="pt-1">
            ${messages}
          </div>
        </div>
      `;
    }

    // ── Variant A: Immersive Reader ──
    function renderVariantA() {
      const sentenceBlocks = LESSON_DATA.sentences.map((s, idx) => {
        const isActive = state.activeSentenceIndex === idx;
        const activeCard = isActive ? 'active-sentence bg-rose-500/10 border-rose-500/40 text-slate-50' : 'bg-slate-800/40 border-slate-800 hover:border-slate-700 text-slate-200';
        return `
          <div class="sentence-row group p-3.5 rounded-2xl border transition-all duration-200 cursor-pointer ${activeCard}" data-index="${idx}">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1">
                <div class="text-base sm:text-lg font-japanese leading-loose tracking-wide">
                  ${renderTokens(s.tokens)}
                </div>
                ${state.showEnglish ? `<p class="mt-1.5 text-xs text-slate-400 font-medium">${s.english}</p>` : ''}
              </div>
              <button class="single-play-btn opacity-60 group-hover:opacity-100 p-1.5 rounded-lg bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white text-xs transition" data-index="${idx}">
                ${isActive && state.isPlaying ? '⏸' : '▶'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          ${renderVocabularyPrimer()}
          <div class="space-y-2.5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">Continuous Reading Story</h3>
            ${sentenceBlocks}
          </div>
        </div>
      `;
    }

    // ── Variant B: Study Cards ──
    function renderVariantB() {
      const cards = LESSON_DATA.sentences.map((s, idx) => {
        const isActive = state.activeSentenceIndex === idx;
        const activeStyle = isActive ? 'active-sentence ring-2 ring-rose-500 bg-slate-800' : 'bg-slate-800/60 border border-slate-800';
        return `
          <div class="rounded-3xl p-4 shadow-lg transition-all ${activeStyle}" data-index="${idx}">
            <div class="flex justify-between items-center mb-3">
              <span class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-slate-700/80 text-slate-300">
                Sentence ${s.id} of 5 · ${s.speaker}
              </span>
              <div class="flex items-center space-x-1">
                <button class="slow-play-btn px-2 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-[10px] font-semibold transition" data-index="${idx}">
                  🐢 0.75x
                </button>
                <button class="single-play-btn px-3 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold transition" data-index="${idx}">
                  ${isActive && state.isPlaying ? 'Stop' : '🔊 Listen'}
                </button>
              </div>
            </div>

            <div class="text-lg font-japanese leading-relaxed text-slate-100 mb-3">
              ${renderTokens(s.tokens)}
            </div>

            <details class="group border-t border-slate-700/50 pt-2 text-xs" ${state.showEnglish ? 'open' : ''}>
              <summary class="cursor-pointer font-medium text-slate-400 hover:text-slate-200 select-none flex items-center justify-between">
                <span>English Meaning</span>
                <span class="group-open:rotate-180 transition-transform">▾</span>
              </summary>
              <p class="mt-1 text-slate-300 font-normal leading-relaxed pl-1">${s.english}</p>
            </details>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          ${renderVocabularyPrimer()}
          <div class="space-y-3">
            ${cards}
          </div>
        </div>
      `;
    }

    // 6. UI UPDATE & RE-RENDER
    function renderCurrentVariant() {
      const root = document.getElementById('variantRoot');
      root.className = 'flex-1 p-4 space-y-4';
      if (state.furiganaMode === 'target') {
        root.classList.add('furigana-target-only');
      } else if (state.furiganaMode === 'hover') {
        root.classList.add('furigana-hidden');
      }

      if (state.variant === 'A') {
        root.innerHTML = renderVariantA();
        document.getElementById('currentVariantLabel').textContent = 'A (Immersive Reader)';
      } else if (state.variant === 'B') {
        root.innerHTML = renderVariantB();
        document.getElementById('currentVariantLabel').textContent = 'B (Study Cards)';
      } else {
        root.innerHTML = renderVariantC();
        document.getElementById('currentVariantLabel').textContent = 'C (Dialogue + Primer)';
      }

      attachDynamicListeners();
      updatePlayerBar();
    }

    function updatePlayerBar() {
      const playIcon = document.getElementById('playIcon');
      const statusLabel = document.getElementById('playerStatusLabel');
      const progressLabel = document.getElementById('playerProgressLabel');
      const progressBar = document.getElementById('progressBar');

      if (state.isPlaying) {
        playIcon.textContent = '⏸';
        statusLabel.textContent = `Playing: Sentence ${state.activeSentenceIndex + 1}`;
        progressLabel.textContent = `Sentence ${state.activeSentenceIndex + 1} of ${LESSON_DATA.sentences.length}`;
        const pct = ((state.activeSentenceIndex + 1) / LESSON_DATA.sentences.length) * 100;
        progressBar.style.width = `${pct}%`;
      } else {
        playIcon.textContent = '▶';
        statusLabel.textContent = 'Tap Play to Listen';
        progressLabel.textContent = `Ready · ${LESSON_DATA.sentences.length} sentences`;
        progressBar.style.width = '0%';
      }

      const loopBtn = document.getElementById('loopSentenceBtn');
      loopBtn.textContent = state.loopSentence ? '🔁 Loop: On' : '🔁 Loop: Off';
      loopBtn.className = state.loopSentence 
        ? 'px-2 py-1 rounded-lg text-[11px] font-bold bg-rose-600 text-white border border-rose-500'
        : 'px-2 py-1 rounded-lg text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700';

      document.querySelectorAll('.var-select-btn').forEach(btn => {
        if (btn.dataset.var === state.variant) {
          btn.className = 'var-select-btn px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-600 text-white';
        } else {
          btn.className = 'var-select-btn px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700';
        }
      });
    }

    function updateUIState() {
      renderCurrentVariant();
    }

    function setVariant(newVar) {
      state.variant = newVar;
      const url = new URL(window.location);
      url.searchParams.set('variant', newVar);
      window.history.replaceState({}, '', url);
      renderCurrentVariant();
    }

    function attachDynamicListeners() {
      // Single play button inside rows/cards
      document.querySelectorAll('.single-play-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index, 10);
          if (state.isPlaying && state.activeSentenceIndex === idx) {
            stopPlayback();
          } else {
            speakSentence(idx);
          }
        });
      });

      // Slow play button
      document.querySelectorAll('.slow-play-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index, 10);
          const origRate = state.playbackRate;
          state.playbackRate = 0.75;
          speakSentence(idx, () => {
            state.playbackRate = origRate;
            stopPlayback();
          });
        });
      });

      // Sentence row click to play
      document.querySelectorAll('.sentence-row').forEach(row => {
        row.addEventListener('click', () => {
          const idx = parseInt(row.dataset.index, 10);
          speakSentence(idx);
        });
      });

      // Vocab isolated word audio button
      document.querySelectorAll('.vocab-speak-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const word = btn.dataset.word;
          speakText(word, 0.85);
        });
      });

      // Vocab example sentence audio button
      document.querySelectorAll('.vocab-example-speak-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const phrase = btn.dataset.phrase;
          speakText(phrase, 0.85);
        });
      });
    }

    // 7. GLOBAL CONTROLS
    document.getElementById('playAllBtn').addEventListener('click', togglePlayAll);

    document.getElementById('loopSentenceBtn').addEventListener('click', () => {
      state.loopSentence = !state.loopSentence;
      updatePlayerBar();
    });

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const spd = parseFloat(btn.dataset.speed);
        state.playbackRate = spd;
        document.querySelectorAll('.speed-btn').forEach(b => {
          if (parseFloat(b.dataset.speed) === spd) {
            b.className = 'speed-btn px-2 py-0.5 rounded bg-rose-600 text-white font-bold';
          } else {
            b.className = 'speed-btn px-2 py-0.5 rounded text-slate-400 hover:text-slate-200';
          }
        });
      });
    });

    document.getElementById('furiganaModeSelect').addEventListener('change', (e) => {
      state.furiganaMode = e.target.value;
      renderCurrentVariant();
    });

    document.getElementById('toggleTranslationsBtn').addEventListener('click', () => {
      state.showEnglish = !state.showEnglish;
      document.getElementById('toggleTranslationsBtn').textContent = state.showEnglish ? 'Visible' : 'Hidden';
      renderCurrentVariant();
    });

    // Voice Modal
    document.getElementById('voiceSelectorBtn').addEventListener('click', () => {
      document.getElementById('voiceModal').classList.remove('hidden');
    });
    document.getElementById('closeVoiceModalBtn').addEventListener('click', () => {
      document.getElementById('voiceModal').classList.add('hidden');
    });
    document.getElementById('saveVoiceBtn').addEventListener('click', () => {
      const selIdx = document.getElementById('voiceListSelect').value;
      state.selectedVoice = selIdx !== "" ? jaVoices[parseInt(selIdx, 10)] : null;
      document.getElementById('voiceModal').classList.add('hidden');
    });

    // Switcher
    const variants = ['A', 'B', 'C'];
    document.getElementById('prevVariantBtn').addEventListener('click', () => {
      const curIdx = variants.indexOf(state.variant);
      const prevIdx = (curIdx - 1 + variants.length) % variants.length;
      setVariant(variants[prevIdx]);
    });
    document.getElementById('nextVariantBtn').addEventListener('click', () => {
      const curIdx = variants.indexOf(state.variant);
      const nextIdx = (curIdx + 1) % variants.length;
      setVariant(variants[nextIdx]);
    });
    document.querySelectorAll('.var-select-btn').forEach(btn => {
      btn.addEventListener('click', () => setVariant(btn.dataset.var));
    });

    window.addEventListener('keydown', (e) => {
      if (['input', 'textarea', 'select'].includes(document.activeElement.tagName.toLowerCase())) return;
      if (e.key === 'ArrowLeft') document.getElementById('prevVariantBtn').click();
      if (e.key === 'ArrowRight') document.getElementById('nextVariantBtn').click();
    });

    const initialUrlParam = new URLSearchParams(window.location.search).get('variant');
    if (initialUrlParam && variants.includes(initialUrlParam.toUpperCase())) {
      state.variant = initialUrlParam.toUpperCase();
    }

    renderCurrentVariant();
  </script>
</body>
</html>
